
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgizaSafe - Customer Registration</title>
    <style>
    nav ul {
        list-style: none;
        margin: 0;
        padding: 18px 25px;
        background-color: #facc15; 
    }

    nav ul li {
      display: inline-block;
      margin-right: 30px;
    }

    nav ul li a {
        color: white;
        text-decoration: none;
    }
</style>
</head>
<body>
    <div id="layout">
        <header>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="CustomerRegistration.html">Customer Registration</a></li>
                </ul>
            </nav>
        </header>
    </div>
    <div id="content">
        <h1>Customer Registration</h1>
        <form action="CustomerRegistrationHandler.php" method="POST">
<table> 
    <tr>
         <td><label for="first_name">First Name:</label></td>
         <td><input type="text" id="first_name" name="first_name" required></td>
         
    </tr>    

    <tr>
          <td><label for="last_name">Last Name:</label></td>
          <td><input type="text" id="last_name" name="last_name" required></td>
          
    </tr>

    <tr>
          <td><label for="middle_name">Middle Name:</label></td>
          <td><input type="text" id="middle_name" name="middle_name"></td>
          
    </tr>

    <tr>
          <td><label for="business_sector">Business Sector:</label></td>
          <td><select id="business_sector" name="business_sector" required>
                <option value="">Select a sector</option>
                <option value="fashion">Fashion</option>
                <option value="beauty">Beauty</option>
                <option value="electronics">Electronics</option>
                <option value="other">Other</option>
            </select></td>
        
    </tr>

<tr>
          <td><label for="business_name">Business Name:</label></td>
          <td><input type="text" id="business_name"
                   name="business_name" required></td>
          
</tr>

<tr>
          <td><label for="business_address">Business Address:</label></td>
          <td><input type="text" id="business_address"
                   name="business_address" required></td>
          
</tr>

<tr>
         
          <td><input type="submit" value="Register"></td>
</tr> 
</table>
</form>
    </div>
</body>
