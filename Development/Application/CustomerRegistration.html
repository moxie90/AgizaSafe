
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgizaSafe - Customer Registration</title>
    <style>
    nav ul {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 30px;
        list-style: none;
        margin: 0;
        padding: 15px 20px;
        background-color: rgb(207, 31, 69);
    }

    nav ul li a {
        color: white;
        text-decoration: none;
        font-size: 16px;
    }

    nav ul li a:hover {
        color: #facc15;
    }
</style>
</head>
<body>
    <div id="layout">
        <header>
            <nav>
                <ul>
                    <li><a href="Home.html">Home</a></li>
                    <li><a href="CustomerRegistration.html">Customer Registration</a></li>
                    <li><a href="CustomerLogin.html">Customer Login</a></li>
                    <li><a href="AdminLogin.html">Admin Login</a></li>
                </ul>
            </nav>
        </header>
    </div>

    <div id="content">
        <h1>Customer Registration</h1>

        <form action="CustomerRegistrationHandler.php" method="POST">

            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" name="first_name" required>
            <br><br>

            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" required>
            <br><br>

            <label for="middle_name">Middle Name:</label>
            <input type="text" id="middle_name" name="middle_name">
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   minlength="8" required>
            <br><br>

            <label for="business_sector">Business Sector:</label>
            <select id="business_sector" name="business_sector" required>
                <option value="">Select a sector</option>
                <option value="fashion">Fashion</option>
                <option value="beauty">Beauty</option>
                <option value="electronics">Electronics</option>
                <option value="other">Other</option>
            </select>
            <br><br>

            <label for="business_name">Business Name:</label>
            <input type="text" id="business_name"
                   name="business_name" required>
            <br><br>

            <label for="business_address">Business Address:</label>
            <input type="text" id="business_address"
                   name="business_address" required>
            <br><br>

            <input type="submit" value="Register">

        </form>
    </div>
</body>
</html>
